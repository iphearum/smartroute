# Install as /etc/nginx/sites-available/psarai.com and link it into
# /etc/nginx/sites-enabled/ after replacing the certificate paths if needed.

server {
    listen 80;
    listen [::]:80;
    server_name psarai.com www.psarai.com;

    return 301 https://psarai.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name psarai.com www.psarai.com;

    ssl_certificate /etc/letsencrypt/live/psarai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psarai.com/privkey.pem;

    client_max_body_size 20m;

    # FastAPI owns the assistant socket. Keep this location above the catch-all
    # so Nginx performs the WebSocket upgrade instead of sending it to Next.js.
    location /ws/assistant {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Next.js owns the same-origin HTTP proxy at /api/backend/* and forwards
    # those requests to FastAPI using its server-only FASTAPI_URL setting.
    location /api/backend/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
